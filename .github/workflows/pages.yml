name: Pages

# Only main is published. main holds the released versions, so the site always
# describes a version someone can actually install.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A second push waits for the deployment in flight instead of cancelling it,
# because a cancelled deployment leaves the site half replaced.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # site/ is plain HTML, CSS and one script, so there is nothing to build.
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
